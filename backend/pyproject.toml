[project]
name = "notree"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "taskiq-redis",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy[asyncio]>=2.1.9",
    "taskiq[reload]>=0.13.0",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "import-linter"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
strict = true
files = ["notree", "tests"]

[tool.importlinter]
root_package = "notree"

# docs/architecture.md 3절의 의존 방향. 위층만 아래층을 import하고, 같은 층끼리는 import하지 않는다.
[[tool.importlinter.contracts]]
name = "모듈 의존 방향"
type = "layers"
containers = ["notree"]
layers = [
    "tutor | review | account",
    "notebook | learner",
    "capture",
    "platform",
]
